apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: 025925168727.dkr.ecr.ap-south-2.amazonaws.com/dev/myrepo:productservice
        ports:
        - containerPort: 7070  # Internal application port